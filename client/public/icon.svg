<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- macOS-style dark tile: lit from above, falling into pure black. -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3c" />
      <stop offset="0.5" stop-color="#1c1c1e" />
      <stop offset="1" stop-color="#000000" />
    </linearGradient>
  </defs>
  <!-- macOS-style squircle tile. The faint edge keeps it visible on dark docks. -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bg)" />
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6" />
  <!-- Line-art tomato: body + calyx leaves + stem, all white strokes. -->
  <g fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="256" cy="308" rx="132" ry="118" />
    <path d="M256 196 C 236 170, 196 160, 158 176" />
    <path d="M256 196 C 276 170, 316 160, 354 176" />
    <path d="M256 196 C 250 168, 258 138, 286 120" />
  </g>
</svg>
